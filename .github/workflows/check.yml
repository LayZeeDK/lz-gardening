name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The tests start thousands of git processes, which cost 40-100 ms each on Windows: the suite took 13 minutes there
    # on 12 cores (2026-11-16), and a runner has 4.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The Node.js floor in package.json engines (tools/hygiene.test.ts checks it) and the current LTS.
        node: ['22.18.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The hygiene tests read every commit's identity.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
